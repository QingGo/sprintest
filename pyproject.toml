[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintest"
version = "0.1.0"
description = "A C/S architecture test runner for heavy AI projects."
dependencies = ["fastapi", "uvicorn", "requests", "pytest"]

[project.scripts]
stest = "sprintest.cli:main"
sprintest = "sprintest.cli:main"
stest-daemon = "sprintest.daemon:run"
sprintest-daemon = "sprintest.daemon:run"

[tool.setuptools]
packages = ["sprintest"]
