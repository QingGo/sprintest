[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sprintest"
version = "0.1.2"
description = "A C/S architecture test runner for heavy AI projects."
authors = [
    { name = "QingGo", email = "zyqingjohn@qq.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "pytest",
    "tomli>=2.4.1",
]
keywords = ["testing", "pytest", "ai", "preloading", "hot-reload"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Repository = "https://github.com/QingGo/sprintest"
Issues = "https://github.com/QingGo/sprintest/issues"

[project.scripts]
stest = "sprintest.cli:main"
sprintest = "sprintest.cli:main"
stest-daemon = "sprintest.daemon:run"
sprintest-daemon = "sprintest.daemon:run"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["sprintest"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["\\.venv", "build", "dist"]

[[tool.mypy.overrides]]
module = [
    "uvicorn.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E: pycodestyle
# F: Pyflakes
# I: isort
# B: flake8-bugbear
# TCH: flake8-type-checking
# PLC: pylint-convention
# UP: pyupgrade
select = ["E", "F", "I", "B", "TCH", "PLC", "UP"]
# E501: Line too long
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# F811: Redefinition of unused name
# F401: Module imported but unused
# B011: Do not call assert False
# PLC0415: import should be at the top-level (allowed for lazy loading in tests)
"tests/*" = ["F811", "F401", "B011", "PLC0415"]

[tool.pyright]
include = ["src/sprintest"]
exclude = ["tests"]
reportMissingTypeStubs = false
reportAny = false
reportGeneralTypeIssues = false
executionEnvironments = [
  { root = "tests", reportArgumentType = false, reportGeneralTypeIssues = false, reportMissingImports = false, reportAny = false }
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.15.11",
    "httpx",
    "types-requests",
    "twine>=6.2.0",
]
